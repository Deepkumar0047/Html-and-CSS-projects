<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey form</title>
</head>
<body>
    <h1 align="center">Customer Feedback</h1>
    <hr>

    <form>
        <h2>Personal Information</h2>

        <label>Full Name</label>
        <input type="text"name="Full Name"placeholder="Enter your Full Name">
        <br>

        <label for="Email">Email</label>
        <input type="email"name="email"placeholder="Enter your email:">
        <br>

        <label for="Age">Age</label>
        <input type="number"name="Age"placeholder="enter your age:">
        <br>

        <label for="Gender">Gender</label>
        <input type="radio"name="Gender"value="Male">Male
        <input type="radio"name="Gender"value="Female">Female
        <input type="radio"name="other"value="other">Other
        
        <hr>

        <h2>Survey Question</h2>

        <label>How did you hear about us?</label>

        <slect name="source">
            <option>select</option>
            <option>Google</option>
            <option>Facebook</option>
            <option>Instagram</option>
            <option>Youtube</option>
        </slect>

        <br>

        <label>which service do you use?</label>
        <br>

        <input type="checkbox"name="service"value="website">website
        <br>

        <input type="checkbox"name="service"value="Mobile app">Mobile app
        <br>

        <input type="checkbox"name="service"value="Customer support">Customer support
        <br>

        <input type="checkbox"name="service"value="Online shopping">online shopping
        <br>

        <label>Rate your Experience</label>

        <input type="radio"name="rating"value="Excllent">
        Excellent
        
        <input type="radio"name="rating"value="Good">
        Good

        <input type="radio"name="rating"value="Average">
        Average

        <input type="radio"name="rating"value="Poor">
        Poor

        <br>

        <input type="submit"value="submit Survey">

        <input type="reset"value="Reset">
    </form>

    <hr>
    <footer>
        <p align="center">2026 Customer Survey Form</p>
    </footer>
</body>
</html>
